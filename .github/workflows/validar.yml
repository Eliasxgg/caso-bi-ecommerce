name: Validar caso público
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentacion-y-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validar-caso.mjs
